[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"celery>=5.6.3",
	"redis>=5.2.1",
	"llama-cpp-python>=0.3.16",
	"torch>=2.11.0",
	# 5.19 is the first release that knows the `embedding_gemma2` architecture
	# of google/embeddinggemma-2
	"transformers>=5.19.0",
	# knowledge deduplication + RAG embeddings, loaded in-process
	"sentence-transformers>=6.1.0",
	# vector columns (pgvector/pgvector:pg16 ships the extension)
	"pgvector>=0.5.1",
	# PDF import: one scanned PDF becomes one page per sheet; the wheel carries
	# PDFium, so no poppler/ghostscript is needed (see app/htr/README.md)
	"pypdfium2>=5.0.0",
	# cloud models for knowledge extraction (app/adapters/cloud_llm.py)
	"anthropic>=1.15.0",
	"openai>=3.31.0",
]
